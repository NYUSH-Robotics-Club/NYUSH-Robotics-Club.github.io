name: Deploy site with Vite

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      # 用 npm ci 而不是 npm install：严格按 package-lock.json 安装，构建可复现
      - run: npm ci
      - run: npm run build

      # GitHub Pages 没有服务端 rewrite，深层链接靠构建时生成的真实文件兜底。
      # 少了任何一个，对应地址在线上都会返回 404 状态码（页面还是能打开，
      # 但搜索引擎不会收录）。这里把它变成构建期的硬性检查。
      - name: Verify SPA fallback files
        run: |
          test -f dist/404.html
          for route in about events contact robomaster-team vex-u-team wechat-code past-event-involvementfair; do
            test -f "dist/$route/index.html" || { echo "::error::缺少 dist/$route/index.html"; exit 1; }
          done
          echo "所有路由外壳文件齐备"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
